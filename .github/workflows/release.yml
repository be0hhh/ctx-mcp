name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v2.2.0)"
        required: true
        default: "v2.2.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ctx-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ctx-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ctx-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ctx-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ctx-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ matrix.asset }}" == *.exe ]]; then
            cp "target/${{ matrix.target }}/release/ctx.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/ctx" "dist/${{ matrix.asset }}"
            chmod 0755 "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute SHA256SUMS and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          chmod 0755 ctx-linux-* ctx-macos-* || true
          sha256sum ctx-* > SHA256SUMS
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ctx-* SHA256SUMS --clobber
          else
            gh release create "$TAG" ctx-* SHA256SUMS --title "$TAG" --generate-notes
          fi
