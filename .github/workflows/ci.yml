name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary & run Cargo unit tests
        run: |
          cargo build --release --locked || cargo build --release
          cargo test --release --locked || cargo test --release
      - name: Verify MCP protocol & isolated setup/uninstall
        shell: bash
        run: |
          BIN="target/release/ctx"
          if [ -f "target/release/ctx.exe" ]; then
            BIN="target/release/ctx.exe"
          fi
          "$BIN" mcp --protocol-check
          ROOT_DIR="$(pwd -W 2>/dev/null || pwd)"
          TMP_HOME="$ROOT_DIR/tmp-ci-home"
          mkdir -p "$TMP_HOME"
          export AGENT_CTX_HOME="$TMP_HOME"
          export AGENT_CTX_RUNTIME_DIR="$TMP_HOME/rt"
          export AGENT_CTX_SNAPSHOT_PATH="$TMP_HOME/cache/snapshot.bin"
          "$BIN" install --targets antigravity,claude
          "$BIN" doctor
          "$BIN" uninstall
          rm -rf "$TMP_HOME"
